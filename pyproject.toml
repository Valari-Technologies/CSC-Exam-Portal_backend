[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  | migrations
  | venv
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", "venv", "staticfiles"]
known_first_party = ["apps", "config"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(migrations|venv|staticfiles)"
# Django attrs (objects, DoesNotExist, etc.) confuse vanilla mypy; keep it
# advisory rather than a hard gate until django-stubs is wired up.
